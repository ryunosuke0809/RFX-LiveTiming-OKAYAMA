# 一般向け・関係者向けホストで管理画面を閉じる。
#
# 管理画面はサーバー側の Cookie セッションで守られているが、
# 総当たりの入口をそもそも公開ホストに置かないための多層防御。
# 管理サブドメインの server ブロックではこのファイルを include しないこと。
#
# nginx は最長一致の prefix location を選ぶため、
# mola-proxy-locations.conf の `location /api/` `location /` より
# こちらが優先される（include の順序に依存しない）。

location /api/admin/ {
    return 404;
}

location /admin {
    return 404;
}
